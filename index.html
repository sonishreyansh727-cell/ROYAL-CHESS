.profile {

}

.section-title {
  color: #e6bd54;

}

.features {

}

.card {
  background: linear-gradient(145deg,#211d14,#111);
  border: 1px solid #655124;
  border-radius: 13px;
  padding: 20px 10px;
  text-align: center;
  min-height: 115px;
  cursor: pointer;
}

.card:active {
  background: #493a1b;
}

.icon {
  font-size: 30px;
  margin-bottom: 10px;
}

.card h3 {
  color: #f0d58b;
  font-size: 14px;
}

footer {
  text-align: center;
  color: #777;
  margin: 35px 0 15px;
  font-size: 12px;
}

</style>
</head>
