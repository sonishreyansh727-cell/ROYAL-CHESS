<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ROYAL CHESS</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>

<style>
*{box-sizing:border-box}
body{
 margin:0;
 background:radial-gradient(circle at top,#292316,#080808 75%);
 color:#f5d77a;
 font-family:Arial,sans-serif;
 text-align:center;
}
header{padding:22px 10px}
h1{font-size:32px;letter-spacing:5px;margin:5px}
header p{color:#c5a04b;letter-spacing:3px}
.card{
 max-width:520px;
 margin:15px auto;
 padding:16px;
 background:#15130f;
 border:1px solid #a9863b;
 border-radius:14px;
}
#status{font-size:18px;margin:10px}
#board{
 display:grid;
 grid-template-columns:repeat(8,1fr);
 grid-template-rows:repeat(8,1fr);
 width:min(90vw,440px);
 aspect-ratio:1;
 margin:15px auto;
 border:5px solid #c5a04b;
 border-radius:5px;
 overflow:hidden;
}
.square{
 display:flex;
 align-items:center;
 justify-content:center;
 font-size:clamp(25px,8vw,48px);
 cursor:pointer;
 user-select:none;
}
.light{background:#f0dfb8}
.dark{background:#795735}
.selected{background:#e5bd50!important}
button{
 background:linear-gradient(135deg,#f5d77a,#b68a30);
 color:#17120c;
 border:0;
 border-radius:9px;
 padding:12px 16px;
 margin:5px;
 font-weight:bold;
 cursor:pointer;
}
button:active{transform:scale(.96)}
#moveHistory{
 text-align:left;
 color:#eee;
 max-height:150px;
 overflow:auto;
}
footer{padding:20px;color:#9d8756;font-size:12px}
</style>
</head>

<body>

<header>
<h1>♛ ROYAL CHESS</h1>
<p>THINK. PLAN. DOMINATE.</p>
</header>

<div class="card">
 <div id="status">Loading chess...</div>
 <div id="board"></div>

 <button onclick="resetGame()">New Game</button>
 <button onclick="undoMove()">Undo</button>
 <button onclick="flipBoard()">Flip Board</button>
</div>

<div class="card">
 <h3>♟ MOVE HISTORY</h3>
 <ol id="moveHistory"></ol>
</div>

<footer>ROYAL CHESS • YOUR GAME. YOUR KINGDOM.</footer>

<script>
const game = new Chess();
const board = document.getElementById("board");

let selected = null;
let flipped = false;

const pieces = {
 w:{k:"♔",q:"♕",r:"♖",b:"♗",n:"♘",p:"♙"},
 b:{k:"♚",q:"♛",r:"♜",b:"♝",n:"♞",p:"♟"}
};

function drawBoard(){
 board.innerHTML="";
 const position=game.board();

 for(let r=0;r<8;r++){
  for(let c=0;c<8;c++){
   const row=flipped?7-r:r;
   const col=flipped?7-c:c;
   const sq=document.createElement("div");

   sq.className="square "+((row+col)%2===0?"light":"dark");
   const piece=position[row][col];

   if(piece){
    sq.textContent=pieces[piece.color][piece.type];
   }

   const squareName="abcdefgh"[col]+(8-row);

   if(selected===squareName){
    sq.classList.add("selected");
   }

   sq.onclick=()=>handleSquare(squareName);
   board.appendChild(sq);
  }
 }
 updateStatus();
 updateHistory();
}

function handleSquare(square){
 if(game.game_over()) return;

 if(selected){
  const move=game.move({
   from:selected,
   to:square,
   promotion:"q"
  });

  selected=null;

  if(move){
   drawBoard();
   return;
  }
 }

 const piece=game.get(square);

 if(piece && piece.color===game.turn()){
  selected=square;
 }else{
  selected=null;
 }

 drawBoard();
}

function updateStatus(){
 let message=game.turn()==="w"?"White's turn":"Black's turn";

 if(game.in_checkmate()){
  message="CHECKMATE! "+(game.turn()==="w"?"Black":"White")+" wins!";
 }else if(game.in_draw()){
  message="GAME DRAW!";
 }else if(game.in_check()){
  message+=" — CHECK!";
 }

 document.getElementById("status").textContent=message;
}

function updateHistory(){
 const list=document.getElementById("moveHistory");
 list.innerHTML="";

 game.history().forEach((move,index)=>{
  if(index%2===0){
   const li=document.createElement("li");
   li.textContent=Math.floor(index/2)+1+". "+move;
   list.appendChild(li);
  }else{
   list.lastElementChild.textContent+="   "+move;
  }
 });
}

function resetGame(){
 game.reset();
 selected=null;
 drawBoard();
}

function undoMove(){
 game.undo();
 selected=null;
 drawBoard();
}

function flipBoard(){
 flipped=!flipped;
 drawBoard();
}

drawBoard();
</script>
</body>
</html>
